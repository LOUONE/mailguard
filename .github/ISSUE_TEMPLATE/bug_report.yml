name: Bug report
description: Something is wrong, broken, or misbehaving.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences describing the symptom.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps. Include commands, inputs, or sample emails if relevant.
      placeholder: |
        1.
        2.
        3.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Error messages, stack traces, screenshots.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mailguard version / commit
      placeholder: "v0.0.1 or commit sha"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, how you ran it (local, CI, container).
    validations:
      required: false
